# Go client stubs for the RFC schema module.
#
# Separate from go.buf.gen.yaml on purpose: that template sets clean: true over
# protobuf/generated/go, so adding a second input there would have the two runs
# wipe each other's output. This one writes into the same tree with clean: false
# and lands under protobuf/rfc*/, which cannot collide with freebusy/*.
#
# protobuf-rfc deliberately sets no go_package — the right value depends on where
# a consumer generates — so managed mode supplies one here, scoped to that module
# so freebusy's own explicit go_package options are left alone.
version: v2
clean: false
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/oh-tarnished/freebusy/protobuf/generated/go
      module: buf.build/the-protobuf-project/rfc
inputs:
  - module: buf.build/the-protobuf-project/rfc
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.11
    out: protobuf/generated/go
    opt: module=github.com/oh-tarnished/freebusy/protobuf/generated/go
  - remote: buf.build/grpc/go:v1.6.0
    out: protobuf/generated/go
    opt: module=github.com/oh-tarnished/freebusy/protobuf/generated/go
  # --- Persistence for the RFC catalogue ---
  #
  # freebusy serves these resources itself (one binary, own `rfc` database), so
  # it needs models and stores for them the same way it does for its own tables.
  # config= is what keeps each RFC in its own schema; see rfc.layout.yaml.
  - local: protoc-gen-store
    out: ./internal/database/rfcgorm
    strategy: all
    opt:
      - target=gorm
      - stores=true
      # filterx: the repository target composes it for AIP-160 List filtering.
      - filters=true
      - go_module=github.com/oh-tarnished/freebusy/internal/database/rfcgorm
      - config=tools/protobuf/buf/config/rfc.layout.yaml
      # Proto<->model converters. Re-enabled on protoc-gen-store 1.5.2, which
      # fixed the import alias for a package whose path ends in a version
      # (protoc-gen-go names .../resource/v1 "resourcev1", not "v1").
      - converters=true

  # Proto-facing repositories: CRUD in protobuf types, so the gRPC servers need
  # no hand-written conversion for 15 RFC packages.
  - local: protoc-gen-store
    out: ./internal/database/rfcrepo
    strategy: all
    opt:
      - target=repository
      - go_module=github.com/oh-tarnished/freebusy/internal/database/rfcrepo
      - gorm_module=github.com/oh-tarnished/freebusy/internal/database/rfcgorm
      - config=tools/protobuf/buf/config/rfc.layout.yaml
