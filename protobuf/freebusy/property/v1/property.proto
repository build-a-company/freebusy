syntax = "proto3";

package freebusy.property.v1;

// (-- api-linter: core::0215::foreign-type-reference=disabled
//     aip.dev/not-precedent: freebusy.shared.v1 is a deliberate, API-wide
//     shared-types package; reusing it beats inlining per-package copies. --)

import "buf/validate/validate.proto";
import "entity/v1/annotations.proto";
import "freebusy/property/v1/enums.proto";
import "freebusy/shared/v1/enums.proto";
import "freebusy/shared/v1/types.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "google/type/date.proto";
import "google/type/money.proto";
import "google/type/postal_address.proto";
import "google/type/timeofday.proto";
import "store/v1/annotations.proto";

option go_package = "github.com/oh-tarnished/freebusy/protobuf/generated/go/property/v1/propertypbv1;propertypbv1";
option java_multiple_files = true;
option java_outer_classname = "PropertyProto";
option java_package = "dev.ohtarnished.freebusy.property.v1";

// A regulatory licence or certificate held by a site or one of its bookable
// resources (e.g. trade licence, fire safety NOC, per-room liquor licence).
//
// Native, and it stays native because no RFC covers it: the IETF standardises
// calendars and directories, not the paperwork a jurisdiction demands to
// operate. It parents onto an RFC 4519 organizationalUnit and names an RFC 9073
// resource, so the only thing freebusy defines here is the licence itself.
//
// One resource covers both scopes: `target` says which, and a resource-scoped
// licence names it in `unit`. `expiry_date` is filterable so renewals due can be
// listed; the certificate itself rides in `attachment`.
message Licence {
  option (entity.v1.table) = {id: ID_STRATEGY_ULID};

  option (google.api.resource) = {
    type: "freebusy.property.v1/Licence"
    pattern: "organizationalUnits/{organizational_unit}/licences/{licence}"
    singular: "licence"
    plural: "licences"
  };

  // The licence name.
  // Format: organizationalUnits/{organizational_unit}/licences/{licence}
  string name = 1 [
    (google.api.field_behavior) = IDENTIFIER,
    (buf.validate.field).string.pattern = "^organizationalUnits/[^/]+/licences/[^/]+$",
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];

  // What the licence covers: the whole property, or the single unit named in
  // `unit`. Derived from whether `unit` is set at create time.
  LicenceTarget target = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The bookable resource this licence covers, for a LICENCE_TARGET_UNIT
  // licence; unset for a site-wide one. Must belong to the parent site.
  //
  // An RFC 9073 VRESOURCE, named rather than embedded: AIP-215 says to refer to
  // a resource by name, and the catalogue is served by the RFC Resources
  // service, not by this one.
  // Format: resources/{resource}
  string unit = 3 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.field_behavior) = IMMUTABLE,
    (google.api.resource_reference) = {type: "protobufrfc.dev/Resource"},
    (buf.validate.field).string.pattern = "^resources/[^/]+$",
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];

  // What kind of licence/certificate this is.
  LicenceType type = 4 [(google.api.field_behavior) = REQUIRED];

  // Licence/certificate number as printed by the issuing authority.
  string licence_number = 5 [
    (google.api.field_behavior) = OPTIONAL,
    (store.v1.query) = {search: true}
  ];

  // The authority or body that issued the licence (e.g. "Municipal Corporation of Goa").
  string issuing_authority = 6 [
    (google.api.field_behavior) = OPTIONAL,
    (store.v1.query) = {search: true}
  ];

  // Date the licence was issued.
  google.type.Date issue_date = 7 [(google.api.field_behavior) = OPTIONAL];

  // Date the licence expires. List calls may filter on this field (e.g.
  // `expiry_date <= 2026-08-01`) to find licences due for renewal.
  google.type.Date expiry_date = 8 [(google.api.field_behavior) = OPTIONAL];

  // Scanned copy of the licence certificate.
  freebusy.shared.v1.Attachment attachment = 9 [(google.api.field_behavior) = OPTIONAL];

  // Any additional free-text notes.
  string notes = 10 [(google.api.field_behavior) = OPTIONAL];

  // Lifecycle state. New licences start ACTIVE (database default).
  LicenceState state = 11 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (store.v1.column) = {default_value: "ACTIVE"}
  ];

  // Creation timestamp.
  google.protobuf.Timestamp create_time = 12 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Last-modification timestamp.
  google.protobuf.Timestamp update_time = 13 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Opaque version for optimistic concurrency (AIP-154); echo on update/delete.
  string etag = 14;
}
