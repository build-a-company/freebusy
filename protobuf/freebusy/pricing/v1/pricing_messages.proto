syntax = "proto3";

package freebusy.pricing.v1;

import "buf/validate/validate.proto";
import "freebusy/pricing/v1/enums.proto";
import "freebusy/pricing/v1/pricing.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/field_mask.proto";
import "google/type/interval.proto";
import "google/type/money.proto";

option go_package = "github.com/oh-tarnished/freebusy/protobuf/generated/go/pricing/v1/pricingpbv1;pricingpbv1";
option java_multiple_files = true;
option java_outer_classname = "PricingMessagesProto";
option java_package = "dev.ohtarnished.freebusy.pricing.v1";

// Request message for RatePlanService.GetRatePlan, AIP-131.
message GetRatePlanRequest {
  // Name of the rate plan to retrieve.
  // Format: ratePlans/{rate_plan}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "freebusy.pricing.v1/RatePlan",
    (buf.validate.field).string.pattern = "^ratePlans/[^/]+$"
  ];
}

// Request message for RatePlanService.ListRatePlans, AIP-132.
message ListRatePlansRequest {
  // Maximum rate plans to return. Defaults to 50, capped at 1000.
  int32 page_size = 1 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).int32 = {
      gte: 0
      lte: 1000
    }
  ];

  // Page token from a previous ListRatePlansResponse.next_page_token.
  string page_token = 2 [(google.api.field_behavior) = OPTIONAL];

  // Filter expression, AIP-160, e.g. `resource="resources/bay-l2-014"`.
  string filter = 3 [(google.api.field_behavior) = OPTIONAL];
}

// Response message for RatePlanService.ListRatePlans, AIP-132.
message ListRatePlansResponse {
  // The rate plans on this page.
  repeated RatePlan rate_plans = 1;

  // Token for the next page, empty when this is the last page.
  string next_page_token = 2;
}

// Request message for RatePlanService.CreateRatePlan, AIP-133.
message CreateRatePlanRequest {
  // The rate plan to create.
  RatePlan rate_plan = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true
  ];

  // Client-assigned id, becoming the last segment of the name. The server
  // generates one when empty.
  string rate_plan_id = 2 [(google.api.field_behavior) = OPTIONAL];
}

// Request message for RatePlanService.UpdateRatePlan, AIP-134.
message UpdateRatePlanRequest {
  // The rate plan to update. Its name field identifies the resource.
  RatePlan rate_plan = 1 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true
  ];

  // Fields to update. An empty mask updates all mutable fields.
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = OPTIONAL];
}

// Request message for RatePlanService.DeleteRatePlan, AIP-135.
message DeleteRatePlanRequest {
  // Name of the rate plan to delete.
  // Format: ratePlans/{rate_plan}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "freebusy.pricing.v1/RatePlan",
    (buf.validate.field).string.pattern = "^ratePlans/[^/]+$"
  ];

  // Opaque version read from the rate plan; the delete is rejected if it
  // changed since (AIP-154).
  string etag = 2 [(google.api.field_behavior) = OPTIONAL];
}

// One line of a quote: what it is, what it came from, and what it cost.
//
// A quote is an audit trail, not just a total. Every component names the rule
// that produced it, so a guest disputing a charge months later can be shown
// which override or fee applied rather than a number nobody can reconstruct.
message QuoteComponent {
  // What kind of line this is.
  ComponentType type = 1;

  // Stable machine code of the rule behind it — a fee's `code`, a tax's `code`,
  // or a promotion's code. Empty for the base rate.
  string code = 2;

  // Human-readable label for receipts.
  string display_name = 3;

  // The amount, negative for discounts.
  google.type.Money amount = 4;
}

// Request message for QuoteService.ComputeQuote.
message ComputeQuoteRequest {
  // The rate plan to price under.
  // Format: ratePlans/{rate_plan}
  string rate_plan = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "freebusy.pricing.v1/RatePlan",
    (buf.validate.field).string.pattern = "^ratePlans/[^/]+$"
  ];

  // The window being priced. Nights are counted in the resource's time zone.
  google.type.Interval window = 2 [
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).required = true
  ];

  // How many resources are being booked. Defaults to 1.
  int32 quantity = 3 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).int32.gte = 0
  ];

  // Party size, for PER_PERSON pricing. Defaults to 1.
  int32 party_size = 4 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).int32.gte = 0
  ];

  // Occupancy across the window, 0-100, for a DYNAMIC_TRIGGER_OCCUPANCY rule.
  //
  // Normally left unset: the server measures it from the allocation engine,
  // which is the only place that knows what is actually taken. Supply it to ask
  // a what-if — "what would this cost at 90% full" — for a rate-card preview or
  // a pricing simulation, without moving any inventory to find out.
  //
  // Optional rather than an oneof against a "measure it" flag: unset already
  // means "measure it", and zero occupancy is a real value a caller may want to
  // model, so presence is read rather than the value.
  optional int32 occupancy_percent = 6 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).int32 = {
      gte: 0
      lte: 100
    }
  ];

  // Promotion codes to attempt. Each is validated and either applied as a
  // COMPONENT_TYPE_PROMOTION line or reported in `rejected_promotion_codes`;
  // an invalid code never fails the quote, because a mistyped code should
  // re-render a price, not an error page.
  repeated string promotion_codes = 7 [(google.api.field_behavior) = OPTIONAL];
}

// Response message for QuoteService.ComputeQuote.
message ComputeQuoteResponse {
  // Every line, in the order applied: base, overrides, discounts, promotions,
  // fees, then taxes. Summing them yields `total`.
  repeated QuoteComponent components = 1;

  // Sum of every component before fees and taxes.
  google.type.Money subtotal = 2;

  // Sum of every tax line.
  google.type.Money tax_total = 3;

  // What the guest pays.
  google.type.Money total = 4;

  // Promotion codes that did not apply, with the reason, so a caller can tell
  // the guest why rather than silently dropping the code.
  repeated RejectedPromotionCode rejected_promotion_codes = 5;
}

// A promotion code that was offered but did not apply.
message RejectedPromotionCode {
  // The code as supplied.
  string code = 1;

  // Why it did not apply, e.g. "expired", "minimum stay not met".
  string reason = 2;
}
