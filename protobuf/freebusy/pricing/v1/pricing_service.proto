syntax = "proto3";

package freebusy.pricing.v1;

import "freebusy/pricing/v1/pricing.proto";
import "freebusy/pricing/v1/pricing_messages.proto";
import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/protobuf/empty.proto";
import "mcp/protobuf/annotations.proto";

option go_package = "github.com/oh-tarnished/freebusy/protobuf/generated/go/pricing/v1/pricingpbv1;pricingpbv1";
option java_multiple_files = true;
option java_outer_classname = "PricingServiceProto";
option java_package = "dev.ohtarnished.freebusy.pricing.v1";

// RatePlanService manages what a bookable resource costs.
//
// Rate plans are the money half of the engine, and the half no RFC covers. They
// attach to an RFC 9073 VRESOURCE by reference rather than living on it, so the
// standards-defined description of a bookable thing never grows a price.
service RatePlanService {
  option (google.api.default_host) = "freebusy.ohtarnished.dev";
  option (mcp.service) = {
    app: {
      name: "Rate Plans"
      version: "1.0.0"
      description: "Manage what a bookable resource costs: base rates, seasonal overrides, fees and taxes."
    }
  };

  // Retrieves one rate plan.
  rpc GetRatePlan(GetRatePlanRequest) returns (RatePlan) {
    option (google.api.http) = {get: "/v1/{name=ratePlans/*}"};
    option (google.api.method_signature) = "name";
  }

  // Lists rate plans, most usefully filtered by the resource they price.
  rpc ListRatePlans(ListRatePlansRequest) returns (ListRatePlansResponse) {
    option (google.api.http) = {get: "/v1/ratePlans"};
  }

  // Creates a rate plan.
  rpc CreateRatePlan(CreateRatePlanRequest) returns (RatePlan) {
    option (google.api.http) = {
      post: "/v1/ratePlans"
      body: "rate_plan"
    };
    option (google.api.method_signature) = "rate_plan,rate_plan_id";
    option (mcp.tool) = {description: "Create a rate plan for a bookable resource, with a base price and optional overrides, fees and taxes."};
  }

  // Updates a rate plan.
  //
  // Editing a plan changes what future quotes cost; it does not reprice a
  // booking already taken, which carries the components it was quoted under.
  rpc UpdateRatePlan(UpdateRatePlanRequest) returns (RatePlan) {
    option (google.api.http) = {
      patch: "/v1/{rate_plan.name=ratePlans/*}"
      body: "rate_plan"
    };
    option (google.api.method_signature) = "rate_plan,update_mask";
  }

  // Deletes a rate plan.
  //
  // Prefer archiving (state ARCHIVED) over deleting: a booking priced under a
  // plan must stay explainable after the plan stops being offered, and a delete
  // takes that record away.
  rpc DeleteRatePlan(DeleteRatePlanRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/{name=ratePlans/*}"};
    option (google.api.method_signature) = "name";
  }
}

// QuoteService prices a window without reserving anything.
//
// Read-only and side-effect free: a quote is an answer, not a claim. Reserving
// is HoldService's job, and the two are separate calls precisely so a caller can
// show a price before committing to inventory.
service QuoteService {
  option (google.api.default_host) = "freebusy.ohtarnished.dev";
  option (mcp.service) = {
    app: {
      name: "Quotes"
      version: "1.0.0"
      description: "Price a booking window under a rate plan. Read-only."
    }
  };

  // Prices a window under a rate plan, returning every component.
  //
  // A custom method (AIP-136): it computes a result rather than fetching a
  // resource, so it takes neither a standard-method name nor its shape.
  //
  // An invalid promotion code is reported in rejected_promotion_codes rather
  // than failing the call — a mistyped code should re-render a price, not an
  // error.
  rpc ComputeQuote(ComputeQuoteRequest) returns (ComputeQuoteResponse) {
    option (google.api.http) = {
      post: "/v1/{rate_plan=ratePlans/*}:computeQuote"
      body: "*"
    };
    option (google.api.method_signature) = "rate_plan,window";
    option (mcp.tool) = {description: "Price a booking window under a rate plan, itemised into base, overrides, discounts, fees and taxes."};
  }
}
