syntax = "proto3";

package freebusy.pricing.v1;

option go_package = "github.com/oh-tarnished/freebusy/protobuf/generated/go/pricing/v1/pricingpbv1;pricingpbv1";
option java_multiple_files = true;
option java_outer_classname = "EnumsProto";
option java_package = "dev.ohtarnished.freebusy.pricing.v1";

// What a price is multiplied by.
//
// Ported from freebusy.property.v1 unchanged. The vocabulary is deliberately
// small: anything more expressive is a rate rule, and rate rules belong in
// RateOverride where they can be scoped to dates and weekdays.
enum PricingUnit {
  // Unset; treated as per-booking.
  PRICING_UNIT_UNSPECIFIED = 0;

  // A flat price for the whole booking.
  PRICING_UNIT_PER_BOOKING = 1;

  // Price multiplied by the number of nights.
  PRICING_UNIT_PER_NIGHT = 2;

  // Price multiplied by party size / resources booked.
  PRICING_UNIT_PER_PERSON = 3;
}

// Lifecycle of a RatePlan.
enum RatePlanState {
  // Unset; never persisted.
  RATE_PLAN_STATE_UNSPECIFIED = 0;

  // Quotable. New rate plans start here.
  RATE_PLAN_STATE_ACTIVE = 1;

  // Retained for existing bookings but no longer offered to new ones. Retiring
  // rather than deleting matters here: a booking priced under a plan must still
  // be explainable months later, when the plan itself is long withdrawn.
  RATE_PLAN_STATE_ARCHIVED = 2;
}

// What a quote line represents. A quote is the audit trail for a price, so each
// component says which rule produced it.
enum ComponentType {
  // Unset; never returned.
  COMPONENT_TYPE_UNSPECIFIED = 0;

  // The base rate, before anything is layered on it.
  COMPONENT_TYPE_BASE = 1;

  // A date- or weekday-scoped override of the base rate.
  COMPONENT_TYPE_RATE_OVERRIDE = 2;

  // A length-of-stay discount.
  COMPONENT_TYPE_LOS_DISCOUNT = 3;

  // A promotional discount, applied by code.
  COMPONENT_TYPE_PROMOTION = 4;

  // A fee added on top of the subtotal.
  COMPONENT_TYPE_FEE = 5;

  // A tax on the taxable base.
  COMPONENT_TYPE_TAX = 6;

  // A dynamic adjustment: the band of a DynamicRule that matched.
  COMPONENT_TYPE_DYNAMIC = 7;
}

// What a DynamicRule reads to decide whether it applies.
//
// Each trigger measures something the calendar cannot: RateOverride already
// moves price by date and weekday, so these are deliberately the levers that
// depend on the state of the world at quote time rather than on when the stay
// falls.
enum DynamicTrigger {
  // Unset; the rule is ignored rather than guessed at.
  DYNAMIC_TRIGGER_UNSPECIFIED = 0;

  // Percentage of the resource pool already taken across the window, 0-100.
  // The yield lever: price rises as the last units go.
  DYNAMIC_TRIGGER_OCCUPANCY = 1;

  // Whole days between the quote and the window's start. The booking-curve
  // lever: early-bird discounts and last-minute pricing are the same rule with
  // the sign flipped.
  DYNAMIC_TRIGGER_LEAD_TIME = 2;

  // Nights in the window. Distinct from LosDiscount, which only ever discounts
  // and never stacks; a length band here can move price either way and composes
  // with the other triggers.
  DYNAMIC_TRIGGER_LENGTH_OF_STAY = 3;
}
