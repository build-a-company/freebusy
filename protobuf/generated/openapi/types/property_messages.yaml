components:
  schemas:
    freebusy.property.v1.CreateLicenceRequest:
      description: Request message for CreateLicence.
      properties:
        licence:
          description: The licence to create. Its name, target, and state fields are
            ignored; target derives from whether `unit` is set.
          properties:
            attachment:
              description: Scanned copy of the licence certificate.
              properties:
                content:
                  description: Raw file content, stored inline in the database. Cleared
                    once the file is migrated to object storage, at which point `uri`
                    takes over.
                  format: byte
                  type: string
                filename:
                  description: Original filename as uploaded.
                  type: string
                mimeType:
                  description: MIME type of the file (e.g. "application/pdf", "image/jpeg").
                  type: string
                sizeBytes:
                  description: Size of the file in bytes.
                  format: int64
                  type: integer
                  x-kubernetes-int-or-string: true
                uploadTime:
                  description: When the file was uploaded.
                  format: date-time
                  type: string
                uri:
                  description: Location of the file once moved to object storage (e.g.
                    an s3:// or https:// URL). Unset while the file lives inline in
                    `content`.
                  type: string
              type: object
            createTime:
              description: Creation timestamp.
              format: date-time
              type: string
            etag:
              description: Opaque version for optimistic concurrency (AIP-154); echo
                on update/delete.
              type: string
            expiryDate:
              description: Date the licence expires. List calls may filter on this
                field (e.g. `expiry_date <= 2026-08-01`) to find licences due for
                renewal.
              properties:
                day:
                  description: Day of a month. Must be from 1 to 31 and valid for
                    the year and month, or 0 to specify a year by itself or a year
                    and month where the day isn't significant.
                  format: int32
                  type: integer
                month:
                  description: Month of a year. Must be from 1 to 12, or 0 to specify
                    a year without a month and day.
                  format: int32
                  type: integer
                year:
                  description: Year of the date. Must be from 1 to 9999, or 0 to specify
                    a date without a year.
                  format: int32
                  type: integer
              type: object
            issueDate:
              description: Date the licence was issued.
              properties:
                day:
                  description: Day of a month. Must be from 1 to 31 and valid for
                    the year and month, or 0 to specify a year by itself or a year
                    and month where the day isn't significant.
                  format: int32
                  type: integer
                month:
                  description: Month of a year. Must be from 1 to 12, or 0 to specify
                    a year without a month and day.
                  format: int32
                  type: integer
                year:
                  description: Year of the date. Must be from 1 to 9999, or 0 to specify
                    a date without a year.
                  format: int32
                  type: integer
              type: object
            issuingAuthority:
              description: The authority or body that issued the licence (e.g. "Municipal
                Corporation of Goa").
              type: string
            licenceNumber:
              description: Licence/certificate number as printed by the issuing authority.
              type: string
            name:
              description: 'The licence name. Format: organizationalUnits/{organizational_unit}/licences/{licence}'
              type: string
            notes:
              description: Any additional free-text notes.
              type: string
            state:
              description: Lifecycle state. New licences start ACTIVE (database default).
              enum:
              - LICENCE_STATE_UNSPECIFIED
              - LICENCE_STATE_ACTIVE
              - LICENCE_STATE_ARCHIVED
              type: string
            target:
              description: 'What the licence covers: the whole property, or the single
                unit named in `unit`. Derived from whether `unit` is set at create
                time.'
              enum:
              - LICENCE_TARGET_UNSPECIFIED
              - LICENCE_TARGET_PROPERTY
              - LICENCE_TARGET_UNIT
              type: string
            type:
              description: What kind of licence/certificate this is.
              enum:
              - LICENCE_TYPE_UNSPECIFIED
              - LICENCE_TYPE_TRADE
              - LICENCE_TYPE_FIRE_SAFETY
              - LICENCE_TYPE_LIQUOR
              - LICENCE_TYPE_FOOD_SAFETY
              - LICENCE_TYPE_TOURISM
              - LICENCE_TYPE_HEALTH
              - LICENCE_TYPE_OTHER
              type: string
            unit:
              description: The bookable resource this licence covers, for a LICENCE_TARGET_UNIT
                licence; unset for a site-wide one. Must belong to the parent site.
              type: string
            updateTime:
              description: Last-modification timestamp.
              format: date-time
              type: string
          type: object
        licenceId:
          description: Optional caller-chosen ID for the licence; the server generates
            one if unset.
          type: string
        parent:
          description: 'The property to attach the licence to. A licence covering
            a single unit also lives under the property: set the licence''s `unit`
            field. Format: organizationalUnits/{organizational_unit}'
          type: string
        requestId:
          description: Caller-supplied idempotency key; identical retries return the
            first result.
          type: string
      type: object
    freebusy.property.v1.DeleteLicenceRequest:
      description: Request message for DeleteLicence.
      properties:
        name:
          description: 'The licence to delete. Format: organizationalUnits/{organizational_unit}/licences/{licence}'
          type: string
      type: object
    freebusy.property.v1.GetLicenceRequest:
      description: Request message for GetLicence.
      properties:
        name:
          description: 'The licence to retrieve. Format: organizationalUnits/{organizational_unit}/licences/{licence}'
          type: string
      type: object
    freebusy.property.v1.ListLicencesRequest:
      description: Request message for ListLicences.
      properties:
        filter:
          description: Filter expression (AIP-160), e.g. `type = LICENCE_TYPE_FIRE_SAFETY`,
            `target = LICENCE_TARGET_UNIT`, `unit = resources/bay-l2-014`, or `expiry_date
            <= 2026-08-01` to find licences due for renewal.
          type: string
        orderBy:
          description: Sort order, e.g. "expiry_date" or "create_time desc".
          type: string
        pageSize:
          description: Maximum number of licences to return. Must be at most 1000;
            larger values are rejected.
          format: int32
          type: integer
        pageToken:
          description: Page token from a previous ListLicences call's next_page_token.
          type: string
        parent:
          description: 'The parent property whose licences to list — property-wide
            and per-unit ones alike; narrow with `filter`. Format: organizationalUnits/{organizational_unit}'
          type: string
      type: object
