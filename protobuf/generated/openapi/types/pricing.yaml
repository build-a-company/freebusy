              displayName:
                description: Human-readable label for receipts.
                type: string
              percent:
                description: Percent of the base subtotal, when charging proportionally.
                format: int32
                type: integer
              pricingUnit:
                description: What the fee is charged per. Defaults to per booking.
                enum:
                - PRICING_UNIT_UNSPECIFIED
                - PRICING_UNIT_PER_BOOKING
                - PRICING_UNIT_PER_NIGHT
                - PRICING_UNIT_PER_PERSON
                type: string
              taxable:
                description: Whether this fee joins the taxable base.
                type: boolean
            type: object
          type: array
        losDiscounts:
          description: Discounts applied once a stay reaches a minimum length. The
            most generous matching discount applies; they do not stack.
          items:
            description: A discount applied once a stay reaches `min_nights`. Exactly
