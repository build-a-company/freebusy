                      properties:
                        amountDelta:
                          description: Flat amount to add, negative to subtract.
                          properties:
                            currencyCode:
                              description: The three-letter currency code defined
                                in ISO 4217.
                              type: string
                            nanos:
                              description: Number of nano (10^-9) units of the amount.
                                The value must be between -999,999,999 and +999,999,999
                                inclusive. If `units` is positive, `nanos` must be
                                positive or zero. If `units` is zero, `nanos` can
                                be positive, zero, or negative. If `units` is negative,
                                `nanos` must be negative or zero. For example $-1.75
                                is represented as `units`=-1 and `nanos`=-750,000,000.
                              format: int32
                              type: integer
                            units:
                              description: The whole units of the amount. For example
                                if `currencyCode` is `"USD"`, then 1 unit is one US
                                dollar.
                              format: int64
                              type: integer
                              x-kubernetes-int-or-string: true
                          type: object
                        percentDelta:
                          description: 'Percent to move the running price by: 20 raises
                            it a fifth, -15 cuts it.'
                          format: int32
                          type: integer
                      type: object
                    displayName:
                      description: Human-readable label carried onto the quote line,
                        e.g. "high occupancy" or "booked within 3 days". A dynamic
                        charge a guest cannot see the reason for is a complaint; this
                        is what makes it explainable.
                      type: string
                    maxThreshold:
                      description: Exclusive upper bound. Zero means unbounded above,
                        so the last band of a ladder needs no sentinel.
                      format: int32
                      type: integer
                    minThreshold:
                      description: Inclusive lower bound of the measured value.
                      format: int32
                      type: integer
                  type: object
                type: array
              trigger:
                description: What this rule measures.
                enum:
                - DYNAMIC_TRIGGER_UNSPECIFIED
                - DYNAMIC_TRIGGER_OCCUPANCY
                - DYNAMIC_TRIGGER_LEAD_TIME
                - DYNAMIC_TRIGGER_LENGTH_OF_STAY
                type: string
            type: object
          type: array
        etag:
          description: Opaque version for optimistic concurrency (AIP-154); echo on
            update/delete.
          type: string
        fees:
          description: Fees added on top of the base subtotal.
          items:
            description: A charge added on top of the base subtotal. Exactly one of
