components:
  schemas:
    freebusy.pricing.v1.Adjustment:
      description: A price adjustment expressed as a proportion or a flat amount.
        Exactly one is set; both may be negative, which is how a discount is written.
      properties:
        amountDelta:
          description: Flat amount to add, negative to subtract.
          properties:
            currencyCode:
              description: The three-letter currency code defined in ISO 4217.
              type: string
            nanos:
              description: Number of nano (10^-9) units of the amount. The value must
                be between -999,999,999 and +999,999,999 inclusive. If `units` is
                positive, `nanos` must be positive or zero. If `units` is zero, `nanos`
                can be positive, zero, or negative. If `units` is negative, `nanos`
                must be negative or zero. For example $-1.75 is represented as `units`=-1
                and `nanos`=-750,000,000.
              format: int32
              type: integer
            units:
              description: The whole units of the amount. For example if `currencyCode`
                is `"USD"`, then 1 unit is one US dollar.
              format: int64
              type: integer
              x-kubernetes-int-or-string: true
          type: object
        percentDelta:
          description: 'Percent to move the running price by: 20 raises it a fifth,
            -15 cuts it.'
          format: int32
          type: integer
      type: object
    freebusy.pricing.v1.DateRange:
      description: An inclusive-start, exclusive-end span of calendar dates.
      properties:
        endDate:
          description: Exclusive end date of the range.
          properties:
            day:
              description: Day of a month. Must be from 1 to 31 and valid for the
                year and month, or 0 to specify a year by itself or a year and month
                where the day isn't significant.
              format: int32
              type: integer
            month:
              description: Month of a year. Must be from 1 to 12, or 0 to specify
                a year without a month and day.
              format: int32
              type: integer
            year:
              description: Year of the date. Must be from 1 to 9999, or 0 to specify
                a date without a year.
              format: int32
              type: integer
          type: object
        startDate:
          description: Inclusive first date of the range.
          properties:
            day:
              description: Day of a month. Must be from 1 to 31 and valid for the
                year and month, or 0 to specify a year by itself or a year and month
                where the day isn't significant.
              format: int32
              type: integer
            month:
              description: Month of a year. Must be from 1 to 12, or 0 to specify
                a year without a month and day.
              format: int32
              type: integer
            year:
              description: Year of the date. Must be from 1 to 9999, or 0 to specify
                a date without a year.
              format: int32
              type: integer
          type: object
      type: object
    freebusy.pricing.v1.DynamicBand:
      description: 'One threshold band of a DynamicRule: the range the measured value
        must fall in, and what happens to the price when it does.'
      properties:
        adjustment:
          description: What the price does inside this band.
          properties:
            amountDelta:
              description: Flat amount to add, negative to subtract.
              properties:
                currencyCode:
                  description: The three-letter currency code defined in ISO 4217.
                  type: string
                nanos:
                  description: Number of nano (10^-9) units of the amount. The value
                    must be between -999,999,999 and +999,999,999 inclusive. If `units`
                    is positive, `nanos` must be positive or zero. If `units` is zero,
                    `nanos` can be positive, zero, or negative. If `units` is negative,
                    `nanos` must be negative or zero. For example $-1.75 is represented
                    as `units`=-1 and `nanos`=-750,000,000.
                  format: int32
                  type: integer
                units:
                  description: The whole units of the amount. For example if `currencyCode`
                    is `"USD"`, then 1 unit is one US dollar.
                  format: int64
                  type: integer
                  x-kubernetes-int-or-string: true
              type: object
            percentDelta:
              description: 'Percent to move the running price by: 20 raises it a fifth,
                -15 cuts it.'
              format: int32
              type: integer
          type: object
        displayName:
          description: Human-readable label carried onto the quote line, e.g. "high
            occupancy" or "booked within 3 days". A dynamic charge a guest cannot
            see the reason for is a complaint; this is what makes it explainable.
          type: string
        maxThreshold:
          description: Exclusive upper bound. Zero means unbounded above, so the last
            band of a ladder needs no sentinel.
          format: int32
          type: integer
        minThreshold:
          description: Inclusive lower bound of the measured value.
          format: int32
          type: integer
      type: object
    freebusy.pricing.v1.DynamicRule:
      description: A rule that moves price according to something measured at quote
        time.
      properties:
        bands:
          description: 'The ladder. Overlapping bands are a configuration error: the
            first match in declaration order wins, so an overlap silently makes a
            later band dead rather than failing, and a quote is the wrong place to
            discover that.'
          items:
            description: 'One threshold band of a DynamicRule: the range the measured
              value must fall in, and what happens to the price when it does.'
            properties:
              adjustment:
                description: What the price does inside this band.
                properties:
                  amountDelta:
                    description: Flat amount to add, negative to subtract.
                    properties:
                      currencyCode:
                        description: The three-letter currency code defined in ISO
                          4217.
                        type: string
                      nanos:
                        description: Number of nano (10^-9) units of the amount. The
                          value must be between -999,999,999 and +999,999,999 inclusive.
                          If `units` is positive, `nanos` must be positive or zero.
                          If `units` is zero, `nanos` can be positive, zero, or negative.
                          If `units` is negative, `nanos` must be negative or zero.
                          For example $-1.75 is represented as `units`=-1 and `nanos`=-750,000,000.
                        format: int32
                        type: integer
                      units:
                        description: The whole units of the amount. For example if
                          `currencyCode` is `"USD"`, then 1 unit is one US dollar.
                        format: int64
                        type: integer
                        x-kubernetes-int-or-string: true
                    type: object
                  percentDelta:
                    description: 'Percent to move the running price by: 20 raises
                      it a fifth, -15 cuts it.'
                    format: int32
                    type: integer
                type: object
              displayName:
                description: Human-readable label carried onto the quote line, e.g.
                  "high occupancy" or "booked within 3 days". A dynamic charge a guest
                  cannot see the reason for is a complaint; this is what makes it
                  explainable.
                type: string
              maxThreshold:
                description: Exclusive upper bound. Zero means unbounded above, so
                  the last band of a ladder needs no sentinel.
                format: int32
                type: integer
              minThreshold:
                description: Inclusive lower bound of the measured value.
                format: int32
                type: integer
            type: object
          type: array
        trigger:
          description: What this rule measures.
          enum:
          - DYNAMIC_TRIGGER_UNSPECIFIED
          - DYNAMIC_TRIGGER_OCCUPANCY
          - DYNAMIC_TRIGGER_LEAD_TIME
          - DYNAMIC_TRIGGER_LENGTH_OF_STAY
          type: string
      type: object
    freebusy.pricing.v1.Fee:
      description: A charge added on top of the base subtotal. Exactly one of `amount`
        or `percent` is set.
      properties:
        amount:
          description: Flat fee amount.
          properties:
            currencyCode:
              description: The three-letter currency code defined in ISO 4217.
              type: string
            nanos:
              description: Number of nano (10^-9) units of the amount. The value must
                be between -999,999,999 and +999,999,999 inclusive. If `units` is
                positive, `nanos` must be positive or zero. If `units` is zero, `nanos`
                can be positive, zero, or negative. If `units` is negative, `nanos`
                must be negative or zero. For example $-1.75 is represented as `units`=-1
                and `nanos`=-750,000,000.
              format: int32
              type: integer
            units:
              description: The whole units of the amount. For example if `currencyCode`
                is `"USD"`, then 1 unit is one US dollar.
              format: int64
              type: integer
              x-kubernetes-int-or-string: true
          type: object
        code:
          description: Stable machine code, e.g. "cleaning_fee".
          type: string
        displayName:
          description: Human-readable label for receipts.
          type: string
        percent:
          description: Percent of the base subtotal, when charging proportionally.
          format: int32
          type: integer
        pricingUnit:
          description: What the fee is charged per. Defaults to per booking.
          enum:
          - PRICING_UNIT_UNSPECIFIED
          - PRICING_UNIT_PER_BOOKING
          - PRICING_UNIT_PER_NIGHT
          - PRICING_UNIT_PER_PERSON
          type: string
        taxable:
          description: Whether this fee joins the taxable base.
          type: boolean
      type: object
    freebusy.pricing.v1.LosDiscount:
      description: A discount applied once a stay reaches `min_nights`. Exactly one
        of `percent_off` or `amount_off` is set.
      properties:
        amountOff:
          description: Fixed amount off the subtotal, when discounting by a flat sum.
          properties:
            currencyCode:
              description: The three-letter currency code defined in ISO 4217.
              type: string
            nanos:
              description: Number of nano (10^-9) units of the amount. The value must
                be between -999,999,999 and +999,999,999 inclusive. If `units` is
                positive, `nanos` must be positive or zero. If `units` is zero, `nanos`
                can be positive, zero, or negative. If `units` is negative, `nanos`
                must be negative or zero. For example $-1.75 is represented as `units`=-1
                and `nanos`=-750,000,000.
              format: int32
              type: integer
            units:
              description: The whole units of the amount. For example if `currencyCode`
                is `"USD"`, then 1 unit is one US dollar.
              format: int64
              type: integer
              x-kubernetes-int-or-string: true
          type: object
        minNights:
          description: Minimum nights before the discount applies.
          format: int32
          type: integer
        percentOff:
          description: Percent off the subtotal, when discounting proportionally.
          format: int32
          type: integer
      type: object
    freebusy.pricing.v1.PriceBounds:
      description: Hard limits on a computed price, applied last — after every override,
        discount, dynamic rule and fee, and before tax.
      properties:
        ceiling:
          description: Never quote above this. Unset means no ceiling — reasonable
            only for a plan with no dynamic rules.
          properties:
            currencyCode:
              description: The three-letter currency code defined in ISO 4217.
              type: string
            nanos:
              description: Number of nano (10^-9) units of the amount. The value must
                be between -999,999,999 and +999,999,999 inclusive. If `units` is
                positive, `nanos` must be positive or zero. If `units` is zero, `nanos`
                can be positive, zero, or negative. If `units` is negative, `nanos`
                must be negative or zero. For example $-1.75 is represented as `units`=-1
                and `nanos`=-750,000,000.
              format: int32
              type: integer
            units:
              description: The whole units of the amount. For example if `currencyCode`
                is `"USD"`, then 1 unit is one US dollar.
              format: int64
              type: integer
              x-kubernetes-int-or-string: true
          type: object
        floor:
          description: Never quote below this. Unset means no floor.
          properties:
            currencyCode:
              description: The three-letter currency code defined in ISO 4217.
              type: string
            nanos:
              description: Number of nano (10^-9) units of the amount. The value must
                be between -999,999,999 and +999,999,999 inclusive. If `units` is
                positive, `nanos` must be positive or zero. If `units` is zero, `nanos`
                can be positive, zero, or negative. If `units` is negative, `nanos`
                must be negative or zero. For example $-1.75 is represented as `units`=-1
                and `nanos`=-750,000,000.
              format: int32
              type: integer
            units:
              description: The whole units of the amount. For example if `currencyCode`
                is `"USD"`, then 1 unit is one US dollar.
              format: int64
              type: integer
              x-kubernetes-int-or-string: true
          type: object
      type: object
    freebusy.pricing.v1.RateOverride:
      description: A price that replaces a plan's base rate for a span of dates, specific
        weekdays, or both.
      properties:
        dateRange:
          description: Dates the override covers. Unset means every date, making this
            a pure weekday rule.
          properties:
            endDate:
              description: Exclusive end date of the range.
              properties:
                day:
                  description: Day of a month. Must be from 1 to 31 and valid for
                    the year and month, or 0 to specify a year by itself or a year
                    and month where the day isn't significant.
                  format: int32
                  type: integer
                month:
                  description: Month of a year. Must be from 1 to 12, or 0 to specify
                    a year without a month and day.
                  format: int32
                  type: integer
                year:
                  description: Year of the date. Must be from 1 to 9999, or 0 to specify
                    a date without a year.
                  format: int32
                  type: integer
              type: object
            startDate:
              description: Inclusive first date of the range.
              properties:
                day:
                  description: Day of a month. Must be from 1 to 31 and valid for
                    the year and month, or 0 to specify a year by itself or a year
                    and month where the day isn't significant.
                  format: int32
                  type: integer
                month:
                  description: Month of a year. Must be from 1 to 12, or 0 to specify
                    a year without a month and day.
                  format: int32
                  type: integer
                year:
                  description: Year of the date. Must be from 1 to 9999, or 0 to specify
                    a date without a year.
                  format: int32
                  type: integer
              type: object
          type: object
        price:
          description: The price in effect while this override matches.
          properties:
            currencyCode:
              description: The three-letter currency code defined in ISO 4217.
              type: string
            nanos:
              description: Number of nano (10^-9) units of the amount. The value must
                be between -999,999,999 and +999,999,999 inclusive. If `units` is
                positive, `nanos` must be positive or zero. If `units` is zero, `nanos`
                can be positive, zero, or negative. If `units` is negative, `nanos`
                must be negative or zero. For example $-1.75 is represented as `units`=-1
                and `nanos`=-750,000,000.
              format: int32
              type: integer
            units:
              description: The whole units of the amount. For example if `currencyCode`
                is `"USD"`, then 1 unit is one US dollar.
              format: int64
              type: integer
              x-kubernetes-int-or-string: true
          type: object
        weekdays:
          description: Weekdays it covers. Empty means every day inside `date_range`.
          items:
            description: Represents a day of the week.
            enum:
            - DAY_OF_WEEK_UNSPECIFIED
            - MONDAY
            - TUESDAY
            - WEDNESDAY
            - THURSDAY
            - FRIDAY
            - SATURDAY
            - SUNDAY
            type: string
          type: array
      type: object
    freebusy.pricing.v1.RatePlan:
      description: 'A RatePlan is what a bookable resource costs: a base price, the
