                nanos:
                  description: Number of nano (10^-9) units of the amount. The value
                    must be between -999,999,999 and +999,999,999 inclusive. If `units`
                    is positive, `nanos` must be positive or zero. If `units` is zero,
                    `nanos` can be positive, zero, or negative. If `units` is negative,
                    `nanos` must be negative or zero. For example $-1.75 is represented
                    as `units`=-1 and `nanos`=-750,000,000.
                  format: int32
                  type: integer
                units:
                  description: The whole units of the amount. For example if `currencyCode`
                    is `"USD"`, then 1 unit is one US dollar.
                  format: int64
                  type: integer
                  x-kubernetes-int-or-string: true
              type: object
          type: object
        createTime:
          description: Creation timestamp.
          format: date-time
          type: string
        description:
          description: Free-form description shown with the offer.
          type: string
        displayName:
          description: Human-friendly name, e.g. "Flexible", "Non-refundable", "Early
            Bird".
          type: string
        dynamicRules:
          description: Rules that move the price by the state of the world rather
            than by the calendar — occupancy, lead time, length of stay. Empty means
            static pricing, which is the default and stays a first-class choice.
          items:
            description: A rule that moves price according to something measured at
