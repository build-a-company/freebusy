                    format: int64
                    type: integer
                    x-kubernetes-int-or-string: true
                type: object
              minNights:
                description: Minimum nights before the discount applies.
                format: int32
                type: integer
              percentOff:
                description: Percent off the subtotal, when discounting proportionally.
                format: int32
                type: integer
            type: object
          type: array
        name:
          description: 'The rate plan name. Format: ratePlans/{rate_plan}'
          type: string
        price:
          description: The default price, interpreted per `pricing_unit`. Overrides
            in `rate_overrides` replace it where they match; this applies where none
            do.
          properties:
            currencyCode:
              description: The three-letter currency code defined in ISO 4217.
              type: string
            nanos:
              description: Number of nano (10^-9) units of the amount. The value must
                be between -999,999,999 and +999,999,999 inclusive. If `units` is
                positive, `nanos` must be positive or zero. If `units` is zero, `nanos`
                can be positive, zero, or negative. If `units` is negative, `nanos`
                must be negative or zero. For example $-1.75 is represented as `units`=-1
                and `nanos`=-750,000,000.
              format: int32
              type: integer
            units:
              description: The whole units of the amount. For example if `currencyCode`
                is `"USD"`, then 1 unit is one US dollar.
              format: int64
              type: integer
              x-kubernetes-int-or-string: true
          type: object
        pricingUnit:
          description: What `price` is charged per. Defaults to per booking.
          enum:
          - PRICING_UNIT_UNSPECIFIED
          - PRICING_UNIT_PER_BOOKING
          - PRICING_UNIT_PER_NIGHT
          - PRICING_UNIT_PER_PERSON
          type: string
        rateOverrides:
          description: 'The rate calendar: date- and weekday-scoped replacements for
            `price`. Later-listed overrides win where two match the same date.'
          items:
            description: A price that replaces a plan's base rate for a span of dates,
