                properties:
                  ceiling:
                    description: Never quote above this. Unset means no ceiling —
                      reasonable only for a plan with no dynamic rules.
                    properties:
                      currencyCode:
                        description: The three-letter currency code defined in ISO
                          4217.
                        type: string
                      nanos:
                        description: Number of nano (10^-9) units of the amount. The
                          value must be between -999,999,999 and +999,999,999 inclusive.
                          If `units` is positive, `nanos` must be positive or zero.
                          If `units` is zero, `nanos` can be positive, zero, or negative.
                          If `units` is negative, `nanos` must be negative or zero.
                          For example $-1.75 is represented as `units`=-1 and `nanos`=-750,000,000.
                        format: int32
                        type: integer
                      units:
                        description: The whole units of the amount. For example if
                          `currencyCode` is `"USD"`, then 1 unit is one US dollar.
                        format: int64
                        type: integer
                        x-kubernetes-int-or-string: true
                    type: object
                  floor:
                    description: Never quote below this. Unset means no floor.
                    properties:
                      currencyCode:
                        description: The three-letter currency code defined in ISO
                          4217.
                        type: string
                      nanos:
                        description: Number of nano (10^-9) units of the amount. The
                          value must be between -999,999,999 and +999,999,999 inclusive.
                          If `units` is positive, `nanos` must be positive or zero.
                          If `units` is zero, `nanos` can be positive, zero, or negative.
                          If `units` is negative, `nanos` must be negative or zero.
                          For example $-1.75 is represented as `units`=-1 and `nanos`=-750,000,000.
                        format: int32
                        type: integer
                      units:
                        description: The whole units of the amount. For example if
                          `currencyCode` is `"USD"`, then 1 unit is one US dollar.
                        format: int64
                        type: integer
                        x-kubernetes-int-or-string: true
                    type: object
                type: object
              createTime:
                description: Creation timestamp.
                format: date-time
                type: string
              description:
                description: Free-form description shown with the offer.
                type: string
              displayName:
                description: Human-friendly name, e.g. "Flexible", "Non-refundable",
                  "Early Bird".
                type: string
              dynamicRules:
                description: Rules that move the price by the state of the world rather
                  than by the calendar — occupancy, lead time, length of stay. Empty
                  means static pricing, which is the default and stays a first-class
                  choice.
                items:
                  description: A rule that moves price according to something measured
                    at quote time.
                  properties:
                    bands:
                      description: 'The ladder. Overlapping bands are a configuration
                        error: the first match in declaration order wins, so an overlap
                        silently makes a later band dead rather than failing, and
                        a quote is the wrong place to discover that.'
                      items:
                        description: 'One threshold band of a DynamicRule: the range
                          the measured value must fall in, and what happens to the
                          price when it does.'
                        properties:
                          adjustment:
                            description: What the price does inside this band.
                            properties:
                              amountDelta:
                                description: Flat amount to add, negative to subtract.
                                properties:
                                  currencyCode:
                                    description: The three-letter currency code defined
                                      in ISO 4217.
                                    type: string
                                  nanos:
