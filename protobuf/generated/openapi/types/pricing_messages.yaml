      type: object
    freebusy.pricing.v1.ListRatePlansRequest:
      description: Request message for RatePlanService.ListRatePlans, AIP-132.
      properties:
        filter:
          description: Filter expression, AIP-160, e.g. `resource="resources/bay-l2-014"`.
          type: string
        pageSize:
          description: Maximum rate plans to return. Defaults to 50, capped at 1000.
          format: int32
          type: integer
        pageToken:
          description: Page token from a previous ListRatePlansResponse.next_page_token.
          type: string
      type: object
