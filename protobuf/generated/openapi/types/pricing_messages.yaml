                    description: Weekdays it covers. Empty means every day inside
                      `date_range`.
                    items:
                      description: Represents a day of the week.
                      enum:
                      - DAY_OF_WEEK_UNSPECIFIED
                      - MONDAY
                      - TUESDAY
                      - WEDNESDAY
                      - THURSDAY
                      - FRIDAY
                      - SATURDAY
                      - SUNDAY
                      type: string
                    type: array
                type: object
              type: array
            resource:
              description: 'The bookable resource this plan prices. Format: resources/{resource}'
              type: string
            state:
              description: Lifecycle state. New plans start ACTIVE.
              enum:
              - RATE_PLAN_STATE_UNSPECIFIED
              - RATE_PLAN_STATE_ACTIVE
              - RATE_PLAN_STATE_ARCHIVED
              type: string
            taxes:
              description: Taxes applied to the taxable base — the subtotal plus every
                fee marked taxable.
              items:
                description: A tax on the taxable base — the subtotal plus every fee
                  marked taxable.
                properties:
                  code:
                    description: Stable machine code, e.g. "occupancy_tax" or "gst".
                    type: string
                  displayName:
                    description: Human-readable label for receipts.
                    type: string
                  percent:
                    description: Rate as a percentage, e.g. 12 for 12% GST.
                    type: number
                type: object
              type: array
            updateTime:
              description: Last-modification timestamp.
              format: date-time
              type: string
          type: object
        updateMask:
          description: Fields to update. An empty mask updates all mutable fields.
          properties:
            paths:
              description: The set of field mask paths.
              items:
                type: string
              type: array
          type: object
      type: object
