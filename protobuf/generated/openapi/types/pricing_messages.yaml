components:
  schemas:
    freebusy.pricing.v1.ComputeQuoteRequest:
      description: Request message for QuoteService.ComputeQuote.
      properties:
        occupancyPercent:
          description: Occupancy across the window, 0-100, for a DYNAMIC_TRIGGER_OCCUPANCY
            rule.
          format: int32
          type: integer
        partySize:
          description: Party size, for PER_PERSON pricing. Defaults to 1.
          format: int32
          type: integer
        promotionCodes:
          description: Promotion codes to attempt. Each is validated and either applied
            as a COMPONENT_TYPE_PROMOTION line or reported in `rejected_promotion_codes`;
            an invalid code never fails the quote, because a mistyped code should
            re-render a price, not an error page.
          items:
            type: string
          type: array
        quantity:
          description: How many resources are being booked. Defaults to 1.
          format: int32
          type: integer
        ratePlan:
          description: 'The rate plan to price under. Format: ratePlans/{rate_plan}'
          type: string
        window:
          description: The window being priced. Nights are counted in the resource's
            time zone.
          properties:
            endTime:
              description: Optional. Exclusive end of the interval.
              format: date-time
              type: string
            startTime:
              description: Optional. Inclusive start of the interval.
              format: date-time
              type: string
          type: object
      type: object
    freebusy.pricing.v1.ComputeQuoteResponse:
      description: Response message for QuoteService.ComputeQuote.
      properties:
        components:
          description: 'Every line, in the order applied: base, overrides, discounts,
            promotions, fees, then taxes. Summing them yields `total`.'
          items:
            description: 'One line of a quote: what it is, what it came from, and
              what it cost.'
            properties:
              amount:
                description: The amount, negative for discounts.
                properties:
                  currencyCode:
                    description: The three-letter currency code defined in ISO 4217.
                    type: string
                  nanos:
                    description: Number of nano (10^-9) units of the amount. The value
                      must be between -999,999,999 and +999,999,999 inclusive. If
                      `units` is positive, `nanos` must be positive or zero. If `units`
                      is zero, `nanos` can be positive, zero, or negative. If `units`
                      is negative, `nanos` must be negative or zero. For example $-1.75
                      is represented as `units`=-1 and `nanos`=-750,000,000.
                    format: int32
                    type: integer
                  units:
                    description: The whole units of the amount. For example if `currencyCode`
                      is `"USD"`, then 1 unit is one US dollar.
                    format: int64
                    type: integer
                    x-kubernetes-int-or-string: true
                type: object
              code:
                description: Stable machine code of the rule behind it — a fee's `code`,
                  a tax's `code`, or a promotion's code. Empty for the base rate.
                type: string
              displayName:
                description: Human-readable label for receipts.
                type: string
              type:
                description: What kind of line this is.
                enum:
                - COMPONENT_TYPE_UNSPECIFIED
                - COMPONENT_TYPE_BASE
                - COMPONENT_TYPE_RATE_OVERRIDE
                - COMPONENT_TYPE_LOS_DISCOUNT
                - COMPONENT_TYPE_PROMOTION
                - COMPONENT_TYPE_FEE
                - COMPONENT_TYPE_TAX
                - COMPONENT_TYPE_DYNAMIC
                type: string
            type: object
          type: array
        rejectedPromotionCodes:
          description: Promotion codes that did not apply, with the reason, so a caller
            can tell the guest why rather than silently dropping the code.
          items:
            description: A promotion code that was offered but did not apply.
            properties:
              code:
                description: The code as supplied.
                type: string
              reason:
                description: Why it did not apply, e.g. "expired", "minimum stay not
                  met".
                type: string
            type: object
          type: array
        subtotal:
          description: Sum of every component before fees and taxes.
          properties:
            currencyCode:
              description: The three-letter currency code defined in ISO 4217.
              type: string
            nanos:
              description: Number of nano (10^-9) units of the amount. The value must
                be between -999,999,999 and +999,999,999 inclusive. If `units` is
                positive, `nanos` must be positive or zero. If `units` is zero, `nanos`
                can be positive, zero, or negative. If `units` is negative, `nanos`
                must be negative or zero. For example $-1.75 is represented as `units`=-1
                and `nanos`=-750,000,000.
              format: int32
              type: integer
            units:
              description: The whole units of the amount. For example if `currencyCode`
                is `"USD"`, then 1 unit is one US dollar.
              format: int64
              type: integer
              x-kubernetes-int-or-string: true
          type: object
        taxTotal:
          description: Sum of every tax line.
          properties:
            currencyCode:
              description: The three-letter currency code defined in ISO 4217.
              type: string
            nanos:
              description: Number of nano (10^-9) units of the amount. The value must
                be between -999,999,999 and +999,999,999 inclusive. If `units` is
                positive, `nanos` must be positive or zero. If `units` is zero, `nanos`
                can be positive, zero, or negative. If `units` is negative, `nanos`
                must be negative or zero. For example $-1.75 is represented as `units`=-1
                and `nanos`=-750,000,000.
              format: int32
              type: integer
            units:
              description: The whole units of the amount. For example if `currencyCode`
                is `"USD"`, then 1 unit is one US dollar.
              format: int64
              type: integer
              x-kubernetes-int-or-string: true
          type: object
        total:
          description: What the guest pays.
          properties:
            currencyCode:
              description: The three-letter currency code defined in ISO 4217.
              type: string
            nanos:
              description: Number of nano (10^-9) units of the amount. The value must
                be between -999,999,999 and +999,999,999 inclusive. If `units` is
                positive, `nanos` must be positive or zero. If `units` is zero, `nanos`
                can be positive, zero, or negative. If `units` is negative, `nanos`
                must be negative or zero. For example $-1.75 is represented as `units`=-1
                and `nanos`=-750,000,000.
              format: int32
              type: integer
            units:
              description: The whole units of the amount. For example if `currencyCode`
                is `"USD"`, then 1 unit is one US dollar.
              format: int64
              type: integer
              x-kubernetes-int-or-string: true
          type: object
      type: object
    freebusy.pricing.v1.CreateRatePlanRequest:
      description: Request message for RatePlanService.CreateRatePlan, AIP-133.
      properties:
        ratePlan:
          description: The rate plan to create.
          properties:
            bounds:
              description: Hard bounds on any computed price. Strongly recommended
                once `dynamic_rules` is non-empty.
              properties:
                ceiling:
                  description: Never quote above this. Unset means no ceiling — reasonable
                    only for a plan with no dynamic rules.
                  properties:
                    currencyCode:
                      description: The three-letter currency code defined in ISO 4217.
                      type: string
                    nanos:
                      description: Number of nano (10^-9) units of the amount. The
                        value must be between -999,999,999 and +999,999,999 inclusive.
                        If `units` is positive, `nanos` must be positive or zero.
                        If `units` is zero, `nanos` can be positive, zero, or negative.
                        If `units` is negative, `nanos` must be negative or zero.
                        For example $-1.75 is represented as `units`=-1 and `nanos`=-750,000,000.
                      format: int32
                      type: integer
                    units:
                      description: The whole units of the amount. For example if `currencyCode`
                        is `"USD"`, then 1 unit is one US dollar.
                      format: int64
                      type: integer
                      x-kubernetes-int-or-string: true
                  type: object
                floor:
                  description: Never quote below this. Unset means no floor.
                  properties:
                    currencyCode:
                      description: The three-letter currency code defined in ISO 4217.
                      type: string
                    nanos:
                      description: Number of nano (10^-9) units of the amount. The
                        value must be between -999,999,999 and +999,999,999 inclusive.
                        If `units` is positive, `nanos` must be positive or zero.
                        If `units` is zero, `nanos` can be positive, zero, or negative.
                        If `units` is negative, `nanos` must be negative or zero.
                        For example $-1.75 is represented as `units`=-1 and `nanos`=-750,000,000.
                      format: int32
                      type: integer
                    units:
                      description: The whole units of the amount. For example if `currencyCode`
                        is `"USD"`, then 1 unit is one US dollar.
                      format: int64
                      type: integer
                      x-kubernetes-int-or-string: true
                  type: object
              type: object
            createTime:
              description: Creation timestamp.
              format: date-time
              type: string
            description:
              description: Free-form description shown with the offer.
              type: string
            displayName:
              description: Human-friendly name, e.g. "Flexible", "Non-refundable",
                "Early Bird".
              type: string
            dynamicRules:
              description: Rules that move the price by the state of the world rather
                than by the calendar — occupancy, lead time, length of stay. Empty
                means static pricing, which is the default and stays a first-class
                choice.
              items:
                description: A rule that moves price according to something measured
                  at quote time.
                properties:
                  bands:
                    description: 'The ladder. Overlapping bands are a configuration
                      error: the first match in declaration order wins, so an overlap
                      silently makes a later band dead rather than failing, and a
                      quote is the wrong place to discover that.'
                    items:
                      description: 'One threshold band of a DynamicRule: the range
                        the measured value must fall in, and what happens to the price
                        when it does.'
                      properties:
                        adjustment:
                          description: What the price does inside this band.
                          properties:
                            amountDelta:
                              description: Flat amount to add, negative to subtract.
                              properties:
                                currencyCode:
                                  description: The three-letter currency code defined
                                    in ISO 4217.
                                  type: string
                                nanos:
                                  description: Number of nano (10^-9) units of the
                                    amount. The value must be between -999,999,999
                                    and +999,999,999 inclusive. If `units` is positive,
                                    `nanos` must be positive or zero. If `units` is
                                    zero, `nanos` can be positive, zero, or negative.
                                    If `units` is negative, `nanos` must be negative
                                    or zero. For example $-1.75 is represented as
                                    `units`=-1 and `nanos`=-750,000,000.
                                  format: int32
                                  type: integer
                                units:
                                  description: The whole units of the amount. For
                                    example if `currencyCode` is `"USD"`, then 1 unit
                                    is one US dollar.
                                  format: int64
                                  type: integer
                                  x-kubernetes-int-or-string: true
                              type: object
                            percentDelta:
                              description: 'Percent to move the running price by:
                                20 raises it a fifth, -15 cuts it.'
                              format: int32
                              type: integer
                          type: object
                        displayName:
                          description: Human-readable label carried onto the quote
                            line, e.g. "high occupancy" or "booked within 3 days".
                            A dynamic charge a guest cannot see the reason for is
                            a complaint; this is what makes it explainable.
                          type: string
                        maxThreshold:
                          description: Exclusive upper bound. Zero means unbounded
                            above, so the last band of a ladder needs no sentinel.
                          format: int32
                          type: integer
                        minThreshold:
                          description: Inclusive lower bound of the measured value.
                          format: int32
                          type: integer
                      type: object
                    type: array
                  trigger:
                    description: What this rule measures.
                    enum:
                    - DYNAMIC_TRIGGER_UNSPECIFIED
                    - DYNAMIC_TRIGGER_OCCUPANCY
                    - DYNAMIC_TRIGGER_LEAD_TIME
                    - DYNAMIC_TRIGGER_LENGTH_OF_STAY
                    type: string
                type: object
              type: array
            etag:
              description: Opaque version for optimistic concurrency (AIP-154); echo
                on update/delete.
              type: string
            fees:
              description: Fees added on top of the base subtotal.
              items:
                description: A charge added on top of the base subtotal. Exactly one
                  of `amount` or `percent` is set.
                properties:
                  amount:
                    description: Flat fee amount.
                    properties:
                      currencyCode:
                        description: The three-letter currency code defined in ISO
                          4217.
                        type: string
                      nanos:
                        description: Number of nano (10^-9) units of the amount. The
                          value must be between -999,999,999 and +999,999,999 inclusive.
                          If `units` is positive, `nanos` must be positive or zero.
                          If `units` is zero, `nanos` can be positive, zero, or negative.
                          If `units` is negative, `nanos` must be negative or zero.
                          For example $-1.75 is represented as `units`=-1 and `nanos`=-750,000,000.
                        format: int32
                        type: integer
                      units:
                        description: The whole units of the amount. For example if
                          `currencyCode` is `"USD"`, then 1 unit is one US dollar.
                        format: int64
                        type: integer
                        x-kubernetes-int-or-string: true
                    type: object
                  code:
                    description: Stable machine code, e.g. "cleaning_fee".
                    type: string
                  displayName:
                    description: Human-readable label for receipts.
                    type: string
                  percent:
                    description: Percent of the base subtotal, when charging proportionally.
                    format: int32
                    type: integer
                  pricingUnit:
                    description: What the fee is charged per. Defaults to per booking.
                    enum:
                    - PRICING_UNIT_UNSPECIFIED
                    - PRICING_UNIT_PER_BOOKING
                    - PRICING_UNIT_PER_NIGHT
                    - PRICING_UNIT_PER_PERSON
                    type: string
                  taxable:
                    description: Whether this fee joins the taxable base.
                    type: boolean
                type: object
              type: array
            losDiscounts:
              description: Discounts applied once a stay reaches a minimum length.
                The most generous matching discount applies; they do not stack.
              items:
                description: A discount applied once a stay reaches `min_nights`.
                  Exactly one of `percent_off` or `amount_off` is set.
                properties:
                  amountOff:
                    description: Fixed amount off the subtotal, when discounting by
                      a flat sum.
                    properties:
                      currencyCode:
                        description: The three-letter currency code defined in ISO
                          4217.
                        type: string
                      nanos:
                        description: Number of nano (10^-9) units of the amount. The
                          value must be between -999,999,999 and +999,999,999 inclusive.
                          If `units` is positive, `nanos` must be positive or zero.
                          If `units` is zero, `nanos` can be positive, zero, or negative.
                          If `units` is negative, `nanos` must be negative or zero.
                          For example $-1.75 is represented as `units`=-1 and `nanos`=-750,000,000.
                        format: int32
                        type: integer
                      units:
                        description: The whole units of the amount. For example if
                          `currencyCode` is `"USD"`, then 1 unit is one US dollar.
                        format: int64
                        type: integer
                        x-kubernetes-int-or-string: true
                    type: object
                  minNights:
                    description: Minimum nights before the discount applies.
                    format: int32
                    type: integer
                  percentOff:
                    description: Percent off the subtotal, when discounting proportionally.
                    format: int32
                    type: integer
                type: object
              type: array
            name:
              description: 'The rate plan name. Format: ratePlans/{rate_plan}'
              type: string
            price:
              description: The default price, interpreted per `pricing_unit`. Overrides
                in `rate_overrides` replace it where they match; this applies where
                none do.
              properties:
                currencyCode:
                  description: The three-letter currency code defined in ISO 4217.
                  type: string
                nanos:
                  description: Number of nano (10^-9) units of the amount. The value
                    must be between -999,999,999 and +999,999,999 inclusive. If `units`
                    is positive, `nanos` must be positive or zero. If `units` is zero,
                    `nanos` can be positive, zero, or negative. If `units` is negative,
                    `nanos` must be negative or zero. For example $-1.75 is represented
                    as `units`=-1 and `nanos`=-750,000,000.
                  format: int32
                  type: integer
                units:
                  description: The whole units of the amount. For example if `currencyCode`
                    is `"USD"`, then 1 unit is one US dollar.
                  format: int64
                  type: integer
                  x-kubernetes-int-or-string: true
              type: object
            pricingUnit:
              description: What `price` is charged per. Defaults to per booking.
              enum:
              - PRICING_UNIT_UNSPECIFIED
              - PRICING_UNIT_PER_BOOKING
              - PRICING_UNIT_PER_NIGHT
              - PRICING_UNIT_PER_PERSON
              type: string
            rateOverrides:
              description: 'The rate calendar: date- and weekday-scoped replacements
                for `price`. Later-listed overrides win where two match the same date.'
              items:
                description: A price that replaces a plan's base rate for a span of
                  dates, specific weekdays, or both.
                properties:
                  dateRange:
                    description: Dates the override covers. Unset means every date,
                      making this a pure weekday rule.
                    properties:
                      endDate:
                        description: Exclusive end date of the range.
                        properties:
                          day:
                            description: Day of a month. Must be from 1 to 31 and
                              valid for the year and month, or 0 to specify a year
                              by itself or a year and month where the day isn't significant.
                            format: int32
                            type: integer
                          month:
                            description: Month of a year. Must be from 1 to 12, or
                              0 to specify a year without a month and day.
                            format: int32
                            type: integer
                          year:
                            description: Year of the date. Must be from 1 to 9999,
                              or 0 to specify a date without a year.
                            format: int32
                            type: integer
                        type: object
                      startDate:
                        description: Inclusive first date of the range.
                        properties:
                          day:
                            description: Day of a month. Must be from 1 to 31 and
                              valid for the year and month, or 0 to specify a year
                              by itself or a year and month where the day isn't significant.
                            format: int32
                            type: integer
                          month:
                            description: Month of a year. Must be from 1 to 12, or
                              0 to specify a year without a month and day.
                            format: int32
                            type: integer
                          year:
                            description: Year of the date. Must be from 1 to 9999,
                              or 0 to specify a date without a year.
                            format: int32
                            type: integer
                        type: object
                    type: object
                  price:
                    description: The price in effect while this override matches.
                    properties:
                      currencyCode:
                        description: The three-letter currency code defined in ISO
                          4217.
                        type: string
                      nanos:
                        description: Number of nano (10^-9) units of the amount. The
                          value must be between -999,999,999 and +999,999,999 inclusive.
                          If `units` is positive, `nanos` must be positive or zero.
                          If `units` is zero, `nanos` can be positive, zero, or negative.
                          If `units` is negative, `nanos` must be negative or zero.
                          For example $-1.75 is represented as `units`=-1 and `nanos`=-750,000,000.
                        format: int32
                        type: integer
                      units:
                        description: The whole units of the amount. For example if
                          `currencyCode` is `"USD"`, then 1 unit is one US dollar.
                        format: int64
                        type: integer
                        x-kubernetes-int-or-string: true
                    type: object
                  weekdays:
                    description: Weekdays it covers. Empty means every day inside
                      `date_range`.
                    items:
                      description: Represents a day of the week.
                      enum:
                      - DAY_OF_WEEK_UNSPECIFIED
                      - MONDAY
                      - TUESDAY
                      - WEDNESDAY
                      - THURSDAY
                      - FRIDAY
                      - SATURDAY
                      - SUNDAY
                      type: string
                    type: array
                type: object
              type: array
            resource:
              description: 'The bookable resource this plan prices. Format: resources/{resource}'
              type: string
            state:
              description: Lifecycle state. New plans start ACTIVE.
              enum:
              - RATE_PLAN_STATE_UNSPECIFIED
              - RATE_PLAN_STATE_ACTIVE
              - RATE_PLAN_STATE_ARCHIVED
              type: string
            taxes:
              description: Taxes applied to the taxable base — the subtotal plus every
                fee marked taxable.
              items:
                description: A tax on the taxable base — the subtotal plus every fee
                  marked taxable.
                properties:
                  code:
                    description: Stable machine code, e.g. "occupancy_tax" or "gst".
                    type: string
                  displayName:
                    description: Human-readable label for receipts.
                    type: string
                  percent:
                    description: Rate as a percentage, e.g. 12 for 12% GST.
                    type: number
                type: object
              type: array
            updateTime:
              description: Last-modification timestamp.
              format: date-time
              type: string
          type: object
        ratePlanId:
          description: Client-assigned id, becoming the last segment of the name.
            The server generates one when empty.
          type: string
      type: object
    freebusy.pricing.v1.DeleteRatePlanRequest:
      description: Request message for RatePlanService.DeleteRatePlan, AIP-135.
      properties:
        etag:
          description: Opaque version read from the rate plan; the delete is rejected
            if it changed since (AIP-154).
          type: string
        name:
          description: 'Name of the rate plan to delete. Format: ratePlans/{rate_plan}'
          type: string
      type: object
    freebusy.pricing.v1.GetRatePlanRequest:
      description: Request message for RatePlanService.GetRatePlan, AIP-131.
      properties:
        name:
          description: 'Name of the rate plan to retrieve. Format: ratePlans/{rate_plan}'
