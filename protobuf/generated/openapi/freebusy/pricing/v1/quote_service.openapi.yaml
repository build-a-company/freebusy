            tags:
                - QuoteService
            description: |-
                Prices a window under a rate plan, returning every component.

                 A custom method (AIP-136): it computes a result rather than fetching a
                 resource, so it takes neither a standard-method name nor its shape.

                 An invalid promotion code is reported in rejected_promotion_codes rather
                 than failing the call — a mistyped code should re-render a price, not an
                 error.
            operationId: QuoteService_ComputeQuote
            parameters:
                - name: ratePlan
                  in: path
                  description: The ratePlan id.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ComputeQuoteRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ComputeQuoteResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
