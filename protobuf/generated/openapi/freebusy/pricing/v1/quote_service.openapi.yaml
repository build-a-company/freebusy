openapi: 3.0.3
info:
    title: QuoteService API
    description: |-
        QuoteService prices a window without reserving anything.

         Read-only and side-effect free: a quote is an answer, not a claim. Reserving
         is HoldService's job, and the two are separate calls precisely so a caller can
         show a price before committing to inventory.
    version: 0.0.1
servers:
    - url: https://freebusy.ohtarnished.dev
